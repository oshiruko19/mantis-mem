version: 2

project_name: mantis-mem

release:
  prerelease: auto

builds:
  - main: ./cmd/mantis-mem
    binary: mantis-mem
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}
    hooks:
      post:
        - cmd: sh -c 'if [ "{{ .Os }}" = "darwin" ] && command -v codesign >/dev/null 2>&1; then codesign --force --sign - "{{ .Path }}"; fi'

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - tools/cloud-sync-projects.sh
      - tools/cloud-sync-projects.ps1
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

brews:
  - repository:
      owner: oshiruko19
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    skip_upload: auto
    directory: Formula
    name: mantis-mem
    homepage: "https://github.com/oshiruko19/mantis-mem"
    description: "Persistent memory for AI coding agents. Agent-agnostic, single binary, zero dependencies."
    license: "MIT"
    commit_msg_template: "chore: update mantis-mem formula to {{ .Tag }}"
