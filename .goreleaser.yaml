version: 2

project_name: mantis-mem

release:
  prerelease: auto

builds:
  - main: .
    binary: mantis-mem
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}
    hooks:
      post:
        - cmd: sh -c 'if [ "{{ .Os }}" = "darwin" ] && command -v codesign >/dev/null 2>&1; then codesign --force --sign - "{{ .Path }}"; fi'

archives:
  # The plugin launcher (plugin/*/bin/download.js) constructs asset names from this
  # template, so keep it in sync with that file. Binary sits at the archive root
  # (wrap_in_directory defaults to false).
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

brews:
  # Homebrew formula. Disabled for now (skip_upload) so a release succeeds without a
  # tap. To publish it: create the oshiruko19/homebrew-tap repo, add the
  # HOMEBREW_TAP_TOKEN repo secret (the release workflow already passes it), and set
  # skip_upload back to `auto` (skips only prereleases/snapshots) or `false`.
  - repository:
      owner: oshiruko19
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    skip_upload: true
    directory: Formula
    name: mantis-mem
    homepage: "https://github.com/oshiruko19/mantis-mem"
    description: "Persistent memory for AI coding agents. Agent-agnostic, single binary, zero dependencies."
    license: "MIT"
    commit_msg_template: "chore: update mantis-mem formula to {{ .Tag }}"
