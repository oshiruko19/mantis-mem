name: Release

# Publish binaries on a version tag. goreleaser cross-compiles the matrix, uploads
# the archives + checksums.txt to a GitHub Release, and (optionally) updates the
# Homebrew tap. The plugin launchers download the matching binary from these assets,
# so nothing is published until a `v*` tag is pushed:
#   git tag v0.1.0 && git push origin v0.1.0
#
# Actions are pinned to commit SHAs (with version comments) for supply-chain safety,
# matching the reference setup this project's release config is derived from.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Go
        # go-version single-sourced from go.mod (consistent with ci.yml), rather
        # than a hardcoded version.
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify module metadata is tidy
        run: go mod tidy -diff

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
